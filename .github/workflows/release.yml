# Publishes to PyPI when a GitHub Release is published.
#
# This uses PyPI Trusted Publishing (OIDC): GitHub proves the workflow's
# identity to PyPI directly, so no API token is ever created, pasted into a
# terminal, or stored as a repository secret. A leaked token is the most common
# way a package gets hijacked; the fix is to not have one.
#
# One-time setup on PyPI, before the first release:
#   PyPI -> Publishing -> add a pending trusted publisher with
#   owner "NamahaTech", repository "prism-eda", workflow "release.yml",
#   and environment "pypi". Repeat on test.pypi.org with environment
#   "testpypi" to use the rehearsal path below.

name: Release

on:
  release:
    types: [published]
  # Lets you rehearse the whole path to TestPyPI without cutting a release.
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version guard below needs tags, not just HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify the tag matches the package version
        # A release tagged v0.1.1 that ships 0.1.0 is unfixable after upload:
        # PyPI never allows a version number to be reused. This guard must cover
        # every path that reaches PyPI, not just the release event -- a
        # workflow_dispatch to pypi skipping it is how an unbumped 0.1.0 once
        # got all the way to the upload step.
        if: github.event_name == 'release' || inputs.target == 'pypi'
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess, sys
          source = pathlib.Path("src/prism_eda/__init__.py").read_text()
          version = re.search(r'__version__ = "([^"]+)"', source).group(1)
          tag = os.environ.get("TAG", "")
          if tag:
              # Release event: the tag being released must name this version.
              if tag.lstrip("v") != version:
                  sys.exit(f"tag {tag!r} does not match __version__ {version!r}")
          else:
              # Manual dispatch: no tag in the ref, so require that this exact
              # commit is tagged v<version>. Catches "forgot to bump" directly.
              expected = f"v{version}"
              tags = subprocess.run(
                  ["git", "tag", "--points-at", "HEAD"],
                  capture_output=True, text=True, check=True,
              ).stdout.split()
              if expected not in tags:
                  sys.exit(
                      f"__version__ is {version!r} but HEAD is not tagged {expected!r} "
                      f"(tags here: {tags or 'none'}). Bump the version and tag the "
                      f"release commit before publishing to PyPI."
                  )
          print(f"tag and version agree: {version}")
          PY
        env:
          TAG: ${{ github.event_name == 'release' && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/prism-eda
    permissions:
      id-token: write   # required for trusted publishing; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/prism-eda
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
